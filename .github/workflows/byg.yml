name: Genbyg testside
on:
  schedule:
    - cron: "17 4,10,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["byg.py"]
permissions:
  contents: write
jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python byg.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Opdater ledige tider"
          git push
